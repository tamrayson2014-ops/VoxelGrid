<!DOCTYPE html>
<html>
<head>
  <title>VoxelGrid Python Web</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background-color: #74b9ff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.10.5/brython.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.10.5/brython_stdlib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body onload="brython()">

  <script>
    let scene, camera, renderer, keys = {}, targetVector = new THREE.Vector3();
    let yaw = 0, pitch = 0, moveSpeed = 0.25, isDragging = false, prevMouse = {x:0, y:0};

    window.addEventListener('load', () => {
      scene = new THREE.Scene(); scene.background = new THREE.Color(0x74b9ff);
      
      // Adjusted camera to look slightly downward at the grid
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 15); 
      pitch = -0.4; 

      renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      let dl = new THREE.DirectionalLight(0xffffff, 0.4); dl.position.set(20, 40, 20); scene.add(dl);

      // Wait 1 second for the Python file to cleanly mount before triggering generation
      setTimeout(() => { 
        if (window.generate_world) {
          window.generate_world(scene); 
        } else {
          console.error("Could not find main.py or generate_world function!");
        }
      }, 1000);

      window.addEventListener('mousedown', e => { isDragging = true; prevMouse = {x: e.clientX, y: e.clientY}; });
      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        yaw -= (e.clientX - prevMouse.x) * 0.005; pitch -= (e.clientY - prevMouse.y) * 0.005;
        pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
        prevMouse = {x: e.clientX, y: e.clientY};
      });
      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
      window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

      function animate() {
        requestAnimationFrame(animate);
        let fx = Math.sin(yaw), fz = Math.cos(yaw);
        if (keys['w']) { camera.position.x -= fx * moveSpeed; camera.position.z -= fz * moveSpeed; }
        if (keys['s']) { camera.position.x += fx * moveSpeed; camera.position.z += fz * moveSpeed; }
        if (keys['a']) { camera.position.x -= fz * moveSpeed; camera.position.z += fx * moveSpeed; }
        if (keys['d']) { camera.position.x += fz * moveSpeed; camera.position.z -= fx * moveSpeed; }
        if (keys[' ']) camera.position.y += moveSpeed; if (keys['shift']) camera.position.y -= moveSpeed;
        targetVector.x = camera.position.x - Math.sin(yaw) * Math.cos(pitch);
        targetVector.y = camera.position.y + Math.sin(pitch);
        targetVector.z = camera.position.z - Math.cos(yaw) * Math.cos(pitch);
        camera.lookAt(targetVector); renderer.render(scene, camera);
      }
      animate();
    });
  </script>

  <script type="text/python" src="main.py"></script>

</body>
</html>
