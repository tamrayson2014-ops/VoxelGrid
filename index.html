
<!DOCTYPE html>
<html>
<head>
  <title>WebCraft 3D Standalone</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background-color: #74b9ff; font-family: monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 15px; height: 15px;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
    }
    
    /* HUD overlay */
    #hud {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      z-index: 10;
      border: 1px solid #485460;
    }
    .green { color: #05c46b; font-weight: bold; }

    /* Click to Play Screen */
    #blocker {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: white;
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair">+</div>

  <div id="blocker">
    <h1 style="color: #2ecc71; margin: 0; font-size: 36px;">WEBCRAFT 3D</h1>
    <p style="margin: 15px 0; color: #aaa;">CLICK ANYWHERE TO LOCK MOUSE & PLAY</p>
    <small style="color: #7f8c8d;">(Press ESC to release mouse menu)</small>
  </div>
  
  <div id="hud">
    <b>⛏️ WebCraft 3D Standalone (v1.0.0)</b><br><br>
    X: <span id="valX" class="green">0</span> | 
    Y: <span id="valY" class="green">5</span> | 
    Z: <span id="valZ" class="green">10</span>
    <br><br>
    🕹️ <b>Movement Matrix:</b><br>
    * Look: <b>Move Mouse</b> (True 3D Look)<br>
    * Walk: <b>W, A, S, D</b><br>
    * Fly Up: <b>Spacebar</b><br>
    * Fly Down: <b>Left Shift</b>
  </div>

  <script>
    let scene, camera, renderer;
    let keys = {};
    let moveSpeed = 0.25;
    
    let yaw = 0, pitch = 0;
    const targetVector = new THREE.Vector3();

    const blocker = document.getElementById('blocker');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x74b9ff); // Classic sky blue

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Light Setup
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      let dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // Block Materials
      const matGrass = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
      const matDirt  = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
      const geometry = new THREE.BoxGeometry(1, 1, 1);

      // Instanced Rendering for 0% CPU Lag
      const size = 50; 
      const totalBlocks = size * size;

      const grassInstances = new THREE.InstancedMesh(geometry, matGrass, totalBlocks);
      const dirtInstances = new THREE.InstancedMesh(geometry, matDirt, totalBlocks);

      let dummy = new THREE.Object3D();
      let idx = 0;

      for (let x = -size/2; x < size/2; x++) {
        for (let z = -size/2; z < size/2; z++) {
          dummy.position.set(x, 0, z);
          dummy.updateMatrix();
          grassInstances.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(x, -1, z);
          dummy.updateMatrix();
          dirtInstances.setMatrixAt(idx, dummy.matrix);
          idx++;
        }
      }

      scene.add(grassInstances);
      scene.add(dirtInstances);

      // 🛑 REAL POINTER LOCK CONTROLS (Works perfectly on GitHub Pages!)
      blocker.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          blocker.style.display = 'none';
        } else {
          blocker.style.display = 'flex';
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement !== document.body) return;
        
        yaw -= e.movementX * 0.0025;
        pitch -= e.movementY * 0.0025;
        pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
      });

      window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
      window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
      
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function updateControls() {
      if (document.pointerLockElement !== document.body) return;

      let forwardX = Math.sin(yaw);
      let forwardZ = Math.cos(yaw);

      if (keys['w']) { camera.position.x -= forwardX * moveSpeed; camera.position.z -= forwardZ * moveSpeed; }
      if (keys['s']) { camera.position.x += forwardX * moveSpeed; camera.position.z += forwardZ * moveSpeed; }
      if (keys['a']) { camera.position.x -= forwardZ * moveSpeed; camera.position.z += forwardX * moveSpeed; }
      if (keys['d']) { camera.position.x += forwardZ * moveSpeed; camera.position.z -= forwardX * moveSpeed; }
      
      if (keys[' ']) camera.position.y += moveSpeed;
      if (keys['shift']) camera.position.y -= moveSpeed;

      targetVector.x = camera.position.x - Math.sin(yaw) * Math.cos(pitch);
      targetVector.y = camera.position.y + Math.sin(pitch);
      targetVector.z = camera.position.z - Math.cos(yaw) * Math.cos(pitch);
      camera.lookAt(targetVector);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateControls();

      document.getElementById("valX").innerText = Math.round(camera.position.x);
      document.getElementById("valY").innerText = Math.round(camera.position.y);
      document.getElementById("valZ").innerText = Math.round(camera.position.z);

      renderer.render(scene, camera);
    }

    init();
    animate();
  </script>
</body>
</html>
